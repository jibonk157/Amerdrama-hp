<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#10101b"><title>Amerdrama</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0d16;color:#fff;font-family:system-ui,Arial}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 17px 85px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:29px;font-weight:900;letter-spacing:-1px;color:#ff446c}.brand span{color:white}.avatar{background:#292938;border-radius:50%;padding:10px}.search{margin:24px 0 16px;background:#222230;border:1px solid #343443;border-radius:14px;padding:14px;color:white;width:100%;font-size:15px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.chip{background:#242432;color:#ddd;border:0;border-radius:20px;padding:10px 15px;white-space:nowrap}.chip.active{background:#ff4169;color:#fff}.hero{height:255px;border-radius:20px;position:relative;overflow:hidden;background:linear-gradient(15deg,#250e25,#87304c 48%,#171c38);display:flex;align-items:end;padding:20px;margin:9px 0 25px}.hero:before{content:'🎬';position:absolute;right:25px;top:32px;font-size:110px;opacity:.5}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0 0 15px;color:#eee}.primary{background:#ff4169;border:0;color:#fff;border-radius:11px;padding:12px 20px;font-weight:700}.section{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section h2{font-size:20px;margin:0}.section small{color:#ff6584}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.poster{height:190px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:65px;position:relative;overflow:hidden}.poster:after{content:'▶ Tonton';position:absolute;bottom:10px;left:10px;background:#0009;border-radius:10px;padding:7px 9px;font-size:12px}.card h3{margin:9px 0 3px;font-size:15px}.card p{margin:0 0 8px;font-size:12px;color:#b9b9c7}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);background:#1b1b29;border-top:1px solid #333344;display:flex;justify-content:space-around;padding:12px 5px 18px}.nav button{background:none;border:0;color:#a7a7b8;font-size:12px}.nav button.active{color:#ff5276}.nav b{display:block;font-size:23px}.hidden{display:none}.player{position:fixed;inset:0;background:#090910;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}.player video{width:100%;max-width:500px;max-height:75vh;background:black;border-radius:14px}.player .close{position:absolute;top:20px;left:20px;background:#333;color:white;border:0;border-radius:30px;padding:12px}.player h2{align-self:center}.empty{color:#aaa;padding:30px 0;text-align:center}</style></head><body><main class="app"><div class="top"><div class="brand">AMER<span>DRAMA</span></div><div class="avatar">👤</div></div><input id="search" class="search" placeholder="🔎 Cari judul drama..." aria-label="Cari drama"><div id="chips" class="chips"></div><section class="hero"><div><h1>Cinta di Ujung Malam</h1><p>Rahasia cinta yang mengubah segalanya.</p><button class="primary" onclick="play(1)">▶ Tonton Sekarang</button></div></section><div class="section"><h2 id="heading">🔥 Drama Populer</h2><small>Amerdrama Original</small></div><div id="cards" class="cards"></div></main><nav class="nav"><button class="active" onclick="tab('home',this)"><b>⌂</b>Beranda</button><button onclick="tab('popular',this)"><b>◈</b>Populer</button><button onclick="tab('favorite',this)"><b>♡</b>Favorit</button><button onclick="tab('profile',this)"><b>☻</b>Profil</button></nav><div id="player" class="player hidden"><button class="close" onclick="closePlayer()">✕ Kembali</button><h2 id="playerTitle"></h2><video id="video" controls playsinline preload="none"></video><p>Video demo • Ganti dengan konten berlisensi milik Anda</p><button class="primary" onclick="toggleFavorite(current)">♡ Tambah / Hapus Favorit</button></div><script>const dramas=[{id:1,title:'Cinta di Ujung Malam',genre:'Romantis',episodes:12,icon:'🌹',bg:'linear-gradient(135deg,#a8395b,#341b51)'},{id:2,title:'Rahasia Sang Pewaris',genre:'Misteri',episodes:16,icon:'👑',bg:'linear-gradient(135deg,#4e407b,#191a32)'},{id:3,title:'Janji Terakhir',genre:'Sedih',episodes:10,icon:'💔',bg:'linear-gradient(135deg,#2c6485,#242038)'},{id:4,title:'Bayangan Masa Lalu',genre:'Misteri',episodes:18,icon:'🌙',bg:'linear-gradient(135deg,#4c5266,#181b29)'},{id:5,title:'Cinta Tanpa Restu',genre:'Romantis',episodes:15,icon:'💕',bg:'linear-gradient(135deg,#ad4860,#582a42)'},{id:6,title:'Tawa di Balik Luka',genre:'Komedi',episodes:8,icon:'🎭',bg:'linear-gradient(135deg,#c48b38,#6c3552)'}];const demo='https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';let category='Semua',page='home',current=1;let favorites=[];try{favorites=JSON.parse(localStorage.getItem('amerdrama-favorites')||'[]')}catch(e){}const $=id=>document.getElementById(id);function renderChips(){ $('chips').innerHTML=['Semua','Romantis','Misteri','Sedih','Komedi'].map(c=>`<button class="chip ${category===c?'active':''}" onclick="filter('${c}')">${c}</button>`).join('')}function render(){renderChips();$('heading').textContent=({home:'🔥 Drama Populer',popular:'⭐ Paling Populer',favorite:'♡ Favorit Saya',profile:'👤 Profil Saya'})[page];let q=$('search').value.toLowerCase();let list=dramas.filter(d=>(category==='Semua'||d.genre===category)&&d.title.toLowerCase().includes(q)&&(page!=='favorite'||favorites.includes(d.id)));if(page==='profile'){$('cards').innerHTML='<div class="empty">Selamat datang di Amerdrama!<p>Versi prototipe • Akun dan login belum aktif.</p></div>';return}$('cards').innerHTML=list.length?list.map(d=>`<article class="card"><div class="poster" style="background:${d.bg}" onclick="play(${d.id})" role="button" tabindex="0">${d.icon}</div><h3>${d.title}</h3><p>${d.genre} • ${d.episodes} Episode</p><button class="chip" onclick="toggleFavorite(${d.id})">${favorites.includes(d.id)?'♥ Disimpan':'♡ Favorit'}</button></article>`).join(''):'<p class="empty">Belum ada drama yang cocok.</p>'}function filter(c){category=c;render()}function tab(p,el){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];try{localStorage.setItem('amerdrama-favorites',JSON.stringify(favorites))}catch(e){}render()}function play(id){current=id;$('playerTitle').textContent=dramas.find(d=>d.id===id).title;$('player').classList.remove('hidden');$('video').src=demo;$('video').play().catch(()=>{})}function closePlayer(){$('video').pause();$('video').removeAttribute('src');$('video').load();$('player').classList.add('hidden')}$('search').addEventListener('input',render);render();</script></body></html>
